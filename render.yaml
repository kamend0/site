services:
  - type: web
    name: kollin-site
    repo: https://github.com/kamend0/site
    runtime: static
    buildCommand: chmod a+x build.sh && ./build.sh
    staticPublishPath: public
    envVars:
      - key: DART_SASS_VERSION
        value: 1.99.0
      - key: GO_VERSION
        value: 1.26.1
      - key: HUGO_VERSION
        value: 0.160.0
      - key: NODE_VERSION
        value: 24.14.1
      - key: TZ
        value: America/Chicago

